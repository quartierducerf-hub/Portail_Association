*{box-sizing:border-box}body{margin:0;background:var(--terre);color:var(--encre);font:16px/1.55 'Gabarito',system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit}header{background:#5B535F;color:#fff;position:sticky;top:0;z-index:10}
.barre-h{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:12px 16px;position:relative}
.barre-h img{height:44px;display:block}nav#menu{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav#menu a{text-decoration:none;padding:7px 11px;border-radius:999px;font-size:14.5px;opacity:.85}nav#menu a:hover{opacity:1;background:rgba(255,255,255,.1)}nav#menu a.actif{opacity:1;background:rgba(255,255,255,.18)}
#burger{display:none;margin-left:auto;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font:inherit}
main{max-width:1180px;margin:0 auto;padding:28px 16px 70px}
h1{font-size:34px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em;text-wrap:balance}h2{font-size:19px;margin:0 0 10px}
.sur{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ecorce);font-weight:600;margin:0 0 6px}
.lead{font-size:18px;color:var(--ecorce);max-width:68ch}.doux{color:var(--ecorce)}
.hero{background:linear-gradient(135deg,#5B535F 0%,#4A4350 55%,#6E6A86 100%);color:#fff;border-radius:22px;padding:42px 38px;margin-bottom:22px}
.hero h1{font-family:'Gambetta',Georgia,serif;font-style:italic;font-weight:600;font-size:42px}.hero .lead{color:rgba(255,255,255,.85)}.hero .sur{color:rgba(255,255,255,.7)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-block;padding:10px 18px;border-radius:999px;background:var(--brume);color:var(--encre);text-decoration:none;border:0;font:inherit;font-weight:600;cursor:pointer}
.hero .btn{background:rgba(255,255,255,.16);color:#fff}.btn.plein{background:#5B535F;color:#fff}.btn.plein:hover{background:#4A4350}.hero .btn.plein{background:#EFF1F2;color:#5B535F}
.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px;margin-top:16px}
.bloc{background:var(--papier);border:1px solid var(--trait);border-radius:16px;padding:20px 22px;margin-bottom:14px}
.liste{padding-left:18px;margin:0}.liste li{margin:6px 0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;margin:0}.kv dt{color:var(--ecorce)}.kv dd{margin:0;overflow-wrap:anywhere}
details.acc{background:var(--papier);border:1px solid var(--trait);border-radius:14px;margin-bottom:8px}
details.acc summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none}details.acc summary::-webkit-details-marker{display:none}
details.acc summary:after{content:'+';float:right;color:var(--ecorce)}details.acc[open] summary:after{content:'–'}
details.acc ul{margin:0;padding:0 22px 16px 38px}details.acc p{margin:0;padding:0 22px 16px}details.acc li{margin:5px 0}
.cherche input{width:100%;max-width:520px;padding:13px 18px;border-radius:999px;border:1px solid var(--trait);background:var(--papier);font:inherit;margin:8px 0 16px;color:inherit}
table.t{width:100%;border-collapse:collapse;font-size:15px}table.t td{padding:9px 6px;border-top:1px solid var(--trait)}table.t td.mt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.barre{display:flex;height:16px;border-radius:99px;overflow:hidden;margin:6px 0 14px}.pas{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:10px;margin-top:12px}
a.doc{display:flex;align-items:center;gap:12px;background:var(--brume);border:1px solid transparent;border-radius:12px;padding:12px 14px;text-decoration:none}
a.doc:hover{border-color:#5B535F;background:var(--papier)}
a.doc .ico{flex:none;width:38px;height:46px;border-radius:6px;background:#5B535F;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;letter-spacing:.04em}
a.doc b{display:block;line-height:1.3}a.doc em{display:block;font-style:normal;color:var(--ecorce);font-size:13.5px;margin-top:2px}
a.doc span:nth-child(2){flex:1;min-width:0}a.doc small{color:var(--ecorce);white-space:nowrap;font-size:12.5px}
.sommaire{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 18px}.sommaire a{padding:7px 13px;border-radius:999px;background:var(--papier);border:1px solid var(--trait);text-decoration:none;font-size:14px}.sommaire a:hover{border-color:#5B535F}
section.bloc{scroll-margin-top:84px}
form label{display:block;margin:12px 0;font-weight:600}form input,form select{display:block;width:100%;max-width:420px;margin-top:6px;padding:11px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--papier);font:inherit;color:inherit}
fieldset{border:0;padding:0;margin:10px 0}.choix{font-weight:500!important;display:flex!important;gap:10px;align-items:center}.choix input{width:auto;display:inline;margin:0}
footer{text-align:center;color:var(--ecorce);font-size:13px;padding:24px 16px 40px}
@media (max-width:900px){#burger{display:block}nav#menu{display:none;position:absolute;top:100%;left:0;right:0;background:#5B535F;flex-direction:column;padding:8px 12px 14px}body.menu-ouvert nav#menu{display:flex}.hero{padding:28px 22px}.hero h1{font-size:32px}h1{font-size:27px}table.t td:last-child{display:none}}
.carte-f{display:flex;flex-direction:column;gap:4px;background:var(--papier);border:1px solid var(--trait);border-radius:16px;padding:20px 22px;text-decoration:none}
.carte-f:hover{border-color:#5B535F}.carte-f b{font-size:18px}.carte-f em{font-style:normal;color:var(--ecorce);font-size:13.5px}.carte-f span{margin-top:6px}.carte-f i{font-style:normal;font-weight:600;color:var(--nuit-t);margin-top:auto;padding-top:10px}
.retour{text-decoration:none;color:var(--ecorce)}
.champ{display:block;margin:0 0 16px;border:0;padding:0}
.champ .lab{display:block;font-weight:600;margin-bottom:6px}.champ .lab small{display:block;font-weight:400;color:var(--ecorce);font-size:13px}
.champ .aide{display:block;color:var(--ecorce);font-size:13.5px;margin-top:4px}
.req{color:var(--penombre)}
.champ input[type=text],.champ input[type=email],.champ input[type=tel],.champ input[type=date],.champ input[type=time],.champ select{display:block;width:100%;max-width:520px;padding:11px 14px;border-radius:12px;border:1px solid var(--trait);background:var(--papier);font:inherit;color:inherit}
.champ input:focus,.champ select:focus{outline:2px solid #5B535F;outline-offset:1px}
.champ.case{display:flex;gap:10px;align-items:flex-start;font-weight:500}.champ.case input{margin-top:5px;width:18px;height:18px;accent-color:#5B535F;flex:none}
.choix{display:flex;gap:10px;align-items:center;margin:6px 0;font-weight:500}.choix input{width:18px;height:18px;accent-color:#5B535F}
.groupe{background:var(--neige);border-radius:14px;padding:14px 16px 4px;margin-bottom:12px}
.g-tete{display:flex;justify-content:space-between;margin-bottom:10px}
.lien{background:none;border:0;color:var(--nuit-t);font:inherit;font-weight:600;cursor:pointer;padding:0}
.sigbox{position:relative;max-width:520px;border:1.5px solid var(--penombre);border-radius:12px;background:#fff;touch-action:none}
.sigbox canvas{display:block;width:100%;height:150px;cursor:crosshair;border-radius:12px}
.sigbox .lien{position:absolute;top:8px;right:12px}
.sigbox .sigtxt{position:absolute;left:14px;bottom:12px;color:#9a948d;font-size:13.5px;pointer-events:none;border-top:1px solid #d8d2cb;padding-top:4px;width:60%}
.sigbox.signe .sigtxt{display:none}
.note{background:var(--brume);border-radius:12px;padding:12px 14px;font-size:14.5px}
.erreurs{background:#fbe9e3;color:#7a2e1c;border-radius:12px;padding:12px 16px;margin:10px 0}.erreurs ul{margin:6px 0 0;padding-left:18px}
.pot{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.merci h1{font-family:'Gambetta',Georgia,serif;font-style:italic}
.petit{font-size:13.5px}
.apercu{background:#fff;color:#2E2A33}
form .champ{font-weight:400;margin:0 0 16px}form .champ .aide{font-weight:400}form .champ.case span{font-weight:500}
.btn.discret{background:none;color:var(--ecorce);border:1px solid var(--trait)}
.dialogue{position:fixed;inset:0;z-index:100;background:rgba(28,26,24,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.boite-d{background:var(--papier);border-radius:18px;padding:24px 26px;max-width:460px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.boite-d p{color:var(--ecorce);margin:8px 0 18px}.boite-d .actions{justify-content:flex-end;margin:0}
.boite-ap{background:var(--papier);border-radius:16px;width:min(900px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.ap-barre{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--trait)}.ap-barre b{margin-right:auto}
.ap-alerte{color:#B03A2E;font-weight:600;font-size:14px}.ap-ok{color:var(--nuit-t);font-weight:600;font-size:14px}
.ap-feuille{overflow:auto;background:#d9d4ce;padding:18px}.ap-feuille .apercu{max-width:800px;margin:0 auto;padding:0 0 10px;box-shadow:0 4px 18px rgba(0,0,0,.18)}
@media print{
  @page{margin:14mm}
  body.avec-apercu>*:not(#apercuModal){display:none!important}
  body.avec-apercu{background:#fff!important}
  #apercuModal{position:static;background:none;padding:0;display:block}
  #apercuModal .boite-ap{max-height:none;width:auto;box-shadow:none;border-radius:0;display:block;overflow:visible}
  #apercuModal .ap-barre{display:none}
  #apercuModal .ap-feuille{background:#fff;padding:0;overflow:visible}
  #apercuModal .apercu{box-shadow:none;padding:0;max-width:none}
  .apercu,.apercu *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

form .bloc{border-top:4px solid var(--penombre);padding-top:18px}
form .bloc h2{color:var(--nuit-t);font-size:15px;text-transform:uppercase;letter-spacing:.07em;padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--trait)}
.champ input:focus,.champ select:focus{outline:2px solid var(--penombre)!important}
.carte-f{border-top:4px solid var(--penombre)}
a.doc .ico{background:linear-gradient(160deg,#5B535F,#8C8BA3)!important}
nav#menu a.actif{background:rgba(239,241,242,.2)}

details.four summary{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
details.four summary:after{content:none}
details.four summary span:first-child{display:flex;flex-direction:column;min-width:0}details.four summary small{font-weight:400;color:var(--ecorce);font-size:13.5px}
details.four summary .mt{text-align:right;white-space:nowrap;display:flex;flex-direction:column}
details.four .corps{padding:0 20px 16px}details.four .corps p{padding:0;margin:8px 0}
h3.cat{margin:22px 0 2px;font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--ecorce)}
.ct{border-top:1px solid var(--trait);margin-top:14px;padding-top:12px}.ct h4{margin:0 0 6px;font-size:16.5px}.ct h5{margin:14px 0 6px;font-size:14px}
table.gar td{font-size:14px}table.gar tr.gr td{background:var(--brume);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ecorce)}
ul.ok,ul.non{list-style:none;padding:0;margin:0}ul.ok li,ul.non li{position:relative;padding:4px 0 4px 26px;font-size:14.5px}
ul.ok li:before,ul.non li:before{position:absolute;left:0;top:5px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
ul.ok li:before{content:'✓';background:#4F7A3A}ul.non li:before{content:'✕';background:#A23B2A}
.clav{background:var(--papier);border:1px solid var(--trait);border-radius:18px;padding:14px;margin:6px 0 24px}
.fil{position:relative;display:flex;flex-direction:column;gap:10px;max-height:min(62vh,560px);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 2px 6px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;font-size:15.5px;overflow-wrap:anywhere}
.msg.asso{background:var(--brume);border-bottom-left-radius:6px;align-self:flex-start}
.msg.moi{background:#5B535F;color:#fff;border-bottom-right-radius:6px;align-self:flex-end}
.msg b.q{display:block;margin-bottom:4px}
.msg .src{display:block;margin-top:8px;font-size:12.5px;color:var(--ecorce)}
.puces{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.puce{border:1px solid var(--trait);background:var(--papier);color:var(--encre);border-radius:999px;padding:7px 12px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.puce:hover,.puce:focus-visible{border-color:#5B535F;outline:none}
.clav-saisie{display:flex;gap:8px;margin-top:12px}
.clav-saisie input{flex:1;min-width:0;padding:12px 16px;border-radius:999px;border:1px solid var(--trait);background:var(--terre);color:inherit;font:inherit;font-size:16px}
.clav-saisie .btn{flex:none}
a.bq{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;background:#5B535F;color:#fff;text-decoration:none;font-weight:600;padding:12px 18px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.22)}
a.bq:hover{background:#4A4350}a.bq[hidden]{display:none}
footer{padding-bottom:88px}
@media print{a.bq{display:none}}
.msg .aussi{margin-top:10px;padding-top:2px;border-top:1px solid var(--trait)}
@media (max-width:600px){a.bq{right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:9px 14px;font-size:14px}}

<main id="contenu"></main><footer>Association du Quartier-du-Cerf · NEQ 1178861762 · 1040, rue Principale, Saint-Côme (Québec) J0K 2B0</footer>
<script>window.PORTAIL={"mission": "L’Association des propriétaires du Quartier du Cerf est un organisme sans but lucratif créé en 2023. Elle représente les propriétaires auprès de la municipalité, gère les lacs, les sentiers et les espaces communs, et organise les services et activités réservés aux membres et à leurs locataires.", "essentiel": [["1 lot = 1 membre = 1 vote.", "Votre numéro de cadastre est votre numéro de membre."], ["Cotisation :", "147 $ par année et par lot, plus 221 $ de frais de bienvenue une seule fois (taxes en sus)."], ["Paiement :", "virement Interac, mot de passe « Terrain », numéro de cadastre en commentaire."], ["Assemblées :", "deux fois par année, en visioconférence."], ["Vous vendez?", "Avisez l’Association dans les 10 jours suivant la vente."]], "saison": ["Embarcations : seulement celles des propriétaires, avec la vignette de l’Association, sur le lac auquel vous avez accès. Aucun moteur.", "Accès aux lacs à pied, de 9 h à 21 h, sans musique ni feu.", "Bacs en bordure au plus tôt à 17 h la veille de la collecte, puis rentrés près du chalet.", "Aucune pancarte sans l’autorisation écrite du CA.", "Lumières décoratives blanches : blanc chaud.", "Résidences de tourisme : aucun bruit extérieur de 23 h à 8 h."], "faits": [["Nom légal", "Association du Quartier-du-Cerf (autre nom : Association du Lac du Cerf et du Lac Bourgeois)"], ["Forme", "Personne morale sans but lucratif (Loi sur les compagnies, partie III)"], ["Constitution", "Lettres patentes du 26 juin 2023"], ["NEQ", "1178861762"], ["Siège", "1040, rue Principale, Saint-Côme (Québec) J0K 2B0"], ["Courriel", "associationquartierducerf@gmail.com"], ["Membres", "Environ 200 lots (1 lot = 1 membre = 1 vote)"]], "ca": [["Nathalie Forest", "Administratrice"], ["Nicolas Plouffe", "Administrateur"], ["Massi Medjkane", "Administrateur"], ["Annie Descoteaux", "Administratrice"], ["Frankie Roy", "Administrateur"], ["Esso (Essoyodou) Tcha Damoin", "Administratrice"]], "role": ["Représenter les propriétaires auprès de la municipalité et préserver la location court terme", "Gérer les accès aux lacs, les quais, les vignettes d’embarcation et la santé des lacs", "Entretenir les sentiers, les parcs et la signalisation", "Organiser des activités votées par les membres (patinoire sur les lacs, etc.)", "Négocier des services de groupe (ramassage des bacs, internet)", "Faire respecter les règlements adoptés en assemblée"], "reglements": [{"t": "1. Informations à fournir à l’achat", "p": ["Tout acquéreur d’un immeuble (terrain vacant compris) doit adhérer à l’Association, comme le prévoit le contrat notarié.", "Fournir au promoteur (info@quartierducerf.com) et à l’Association : nom des propriétaires ou de la société, téléphones, courriel. Ces renseignements forment le Registre des membres.", "Tout changement doit être transmis dans les 10 jours. À défaut : frais automatiques de 200 $."]}, {"t": "2. Dispositions générales", "p": ["Deux assemblées annuelles en visioconférence (printemps et automne). Langue officielle : le français.", "5 administrateurs, dont 2 promoteurs jusqu’à la fin complète du projet. (Le CA compte 6 administrateurs depuis janvier 2025.)", "Quorum : 50 % + 1.", "Décisions de plus de 5 000 $ : approbation d’au moins 75 % des membres votants.", "1 immeuble = 1 droit de vote = 1 cotisation. Plusieurs immeubles = autant de votes et de cotisations.", "Membre votant : frais de bienvenue et cotisation payés. Membre non votant : en défaut de paiement. Il perd son droit de vote et, avec ses invités et locataires, l’accès aux activités et services."]}, {"t": "3.1 Conditions relatives aux propriétaires", "p": ["Projet de villégiature : location court terme permise selon les conditions de la municipalité.", "Aucune enseigne, réclame ou affiche dans les chemins ou à l’entrée sans autorisation écrite du CA (sauf le promoteur pour la vente initiale). Amende : 250 $ par pancarte (rappel de 200 $ à l’AGA 2026).", "Le propriétaire fait respecter les règlements par sa famille, ses invités, locataires, employés, entrepreneurs et courtiers.", "Terrain et immeuble entretenus à ses frais, propres et conformes.", "Location court ou long terme : inclure les « Règlements du domaine » (p. 6-7) dans le contrat de location et le cahier de bienvenue."]}, {"t": "3.2 Terrains, immeubles et bacs", "p": ["Chaque propriétaire est responsable des dommages causés aux biens de l’Association par lui, ses locataires ou ses invités.", "Bacs : ordures en sacs, bacs propres et fermés, rangés hors de la marge avant sauf pour la collecte, dissimulés s’ils sont visibles; en bordure au plus tôt à 17 h la veille de la collecte.", "Infractions au règlement municipal refacturées : 100 $ (1re), 300 $ (1re récidive), 500 $ (récidives suivantes)."]}, {"t": "4. Obligations financières", "p": ["L’Association gère les obligations financières et la comptabilité de ses biens. Le promoteur initial ne participe pas financièrement.", "Charges annuelles possibles : entretien paysager, déneigement, surveillance, entretien extérieur, quais et équipements, produits d’entretien, frais de bureau, publicité, guérite, frais juridiques et comptables. Réévaluées chaque année.", "État de compte annuel, 30 jours pour payer, 2 % d’intérêt par mois ensuite, frais de recouvrement à la charge du membre.", "Le CA peut négocier les assurances et les contrats d’emploi, et signer des contrats jusqu’à 5 000 $ avant taxes. Le représentant mandaté peut autoriser 500 $ par contrat.", "Entretien et réfection des chemins communs, sentiers et plans d’eau."]}, {"t": "5. Règlements spécifiques", "p": ["Interdit de brancher un autre immeuble aux services publics à partir de son terrain ou de consentir une servitude de passage de ligne électrique ou de télécommunication sans l’accord écrit de l’Association. Pénalité : 200 000 $.", "Toute modification cadastrale doit être approuvée par l’Association ou le promoteur.", "Le CA peut refuser un projet hors du cadre du Quartier-du-Cerf (lieu de culte, restauration, maison de chambres…)."]}, {"t": "Règlements du domaine : chemins et espaces communs", "p": ["Stationnement interdit dans les rues et espaces communs (remorquage aux frais du propriétaire).", "Ne rien laisser ni encombrer dans les chemins, sentiers et parcs. Aucune appropriation d’un espace commun.", "Animaux en laisse; ramasser leurs besoins.", "Aucune drogue, cannabis, alcool, tabac ni vapotage dans les espaces communs."]}, {"t": "Règlements du domaine : plans d’eau et accès aux lacs", "p": ["Aucune embarcation à moteur (essence, diesel ou électrique), ni motoneige ou VTT sur les lacs, en tout temps.", "Seules les embarcations des propriétaires avec la vignette de leur chalet sont permises; aucune embarcation de l’extérieur (protection contre les espèces envahissantes comme le myriophylle à épis). Une couleur de vignette par lac.", "Seules les embarcations avec une vignette de stationnement valide peuvent rester sur place; sinon, fourrière de 200 $ par semaine.", "Utiliser l’accès attribué, à pied seulement, de 9 h à 21 h. Pas de musique, de bruit excessif ni de feu."]}, {"t": "Règlements du domaine : règles générales", "p": ["Circuler seulement dans les chemins, sentiers et espaces communs désignés : les boisés appartiennent à des propriétaires.", "Feux d’artifice et feux à ciel ouvert interdits; foyer avec pare-étincelles sur lit de gravier seulement.", "Tranquillité en tout temps. Résidences de tourisme : aucune activité extérieure bruyante de 23 h à 8 h.", "Aucune matière dangereuse ou malodorante. Aucune chasse.", "Lumières décoratives blanches : blanc chaud (ajout adopté par le CA le 15 mai 2025).", "Si le propriétaire est en défaut de paiement, ses invités et locataires n’ont pas accès aux activités et services, mais doivent respecter les règlements."]}], "faq": [["Suis-je obligé d’être membre?", "Oui si votre contrat notarié contient la clause d’association : l’acquéreur s’engage à faire partie de l’association, à payer la cotisation et à respecter les règlements adoptés en assemblée. Quelques actes n’avaient pas la clause complète (« erreur cléricale ») : la correction se fait chez le notaire, aux frais du promoteur."], ["Combien coûte l’Association?", "147 $ par année et par lot, plus des frais de bienvenue de 221 $ payés une seule fois par lot, soit 368 $ la première année. Le budget 2026 prévoit 29 400 $ pour 200 propriétaires. Les taxes doivent maintenant être ajoutées."], ["Comment payer ma cotisation?", "Par virement Interac à associationquartierducerf@gmail.com avec le mot de passe « Terrain », en inscrivant votre numéro de cadastre en commentaire, ou par chèque au 1040, rue Principale, Saint-Côme, J0K 2B0. Délai : 30 jours."], ["Quel est mon numéro de membre?", "Votre numéro de cadastre. Il figure sur la facture de l’Association."], ["J’ai deux terrains : combien de votes et de cotisations?", "Un lot = un vote = une cotisation et des frais de bienvenue. Deux lots = deux votes et deux cotisations."], ["Je vends mon terrain : l’acheteur paie-t-il les frais de bienvenue?", "Oui, chaque nouveau membre les paie. Le vendeur ou l’acheteur doit aviser l’Association dans les 10 jours suivant le transfert (sinon, frais de 200 $)."], ["L’Association s’occupe-t-elle des chemins?", "Pas pour l’instant. Les chemins sont privés et appartiennent au promoteur (Gestion immobilière les 3 Lacs). Leur entretien est à la charge des propriétaires selon la servitude du contrat notarié et il est facturé séparément. Le transfert des chemins à l’Association est reporté (dossier de gestion des eaux pluviales). À l’AGA du 10 sept. 2025, 65 % ont préféré des chemins privés en asphalte recyclé (sondage)."], ["Et le déneigement?", "La municipalité déneige et facture sur le compte de taxes municipales."], ["Puis-je utiliser mon kayak sur le lac?", "Oui, sur le lac auquel vous avez accès selon votre contrat, avec la vignette de l’Association (gratuite, une couleur par lac). Aucune embarcation de l’extérieur ni à moteur."], ["Quand puis-je aller au lac?", "À pied, par l’accès attribué, de 9 h à 21 h, sans musique ni feu."], ["Comment fonctionne le ramassage des bacs?", "Les bacs vont en bordure au plus tôt à 17 h la veille de la collecte et reviennent près du chalet ensuite. Un service collectif optionnel de déplacement des bacs (Groupe CTNP) coûte de 382,53 $ à 512 $ par année avant taxes selon le nombre de chalets inscrits."], ["Puis-je installer une pancarte?", "Non, pas sans l’autorisation écrite du CA. Amende de 200 à 250 $ par pancarte non autorisée."], ["La location court terme est-elle permise?", "Oui, selon les conditions de la municipalité. Vos locataires doivent recevoir les « Règlements du domaine ». Aucun bruit extérieur de 23 h à 8 h."], ["Comment se passent les assemblées?", "En visioconférence (plateforme Upperbee). Les liens arrivent de noreply@upperbee.com. Quorum : 50 % + 1. Si vous êtes absent, envoyez une procuration (ou une résolution pour une société) au plus tard 72 heures avant, à associationquartierducerf@gmail.com."], ["Qui joindre?", "Ventes et propriétés : info@quartierducerf.com. Association (services, activités, factures) : associationquartierducerf@gmail.com. Urgence : 514 914-5260 (appel et texto) et le groupe Messenger privé."], ["Mes taxes municipales arrivent encore au nom de l’ancien propriétaire.", "La mise à jour à la MRC peut prendre de 6 à 12 mois. Transmettez vos coordonnées à la municipalité de Saint-Côme et au service des taxes scolaires."], ["Où trouver les procès-verbaux et les budgets?", "Dans la section Documents de ce portail : procès-verbaux, ordres du jour, budgets et formulaires, classés par assemblée."]], "assemblees": [{"d": "2026-09-29", "titre": "Assemblée générale annuelle 2026 (Upperbee)", "etat": "Tenue, rencontre écourtée : résultats à inscrire", "votes": []}, {"d": "2025-09-10", "titre": "2e assemblée générale annuelle", "etat": "Tenue", "votes": [["Activité no 1", "Patinoire sur les lacs, adoptée à 74 %"], ["Activité no 2", "Rejetée (abstention 25 %)"], ["Sondage : revêtement des chemins", "Chemins privés en asphalte recyclé, 65 %"], ["Blocs de la rue du Renard", "Conservés, 75 %"], ["Prélèvement automatique (DPA)", "Rejeté, 61 %"], ["Liste d’urgence des chalets construits", "Adoptée, 57 %"]]}, {"d": "2025-06-17", "titre": "Assemblée du 17 juin 2025", "etat": "Reportée (problème technique Upperbee)", "votes": []}, {"d": "2025-01-08", "titre": "1re assemblée générale annuelle (Upperbee)", "etat": "Tenue", "votes": [["Budget 2025", "Adopté à 85 % (4 contre, 7 abstentions)"], ["Cahier des membres (règlements)", "Adopté à 70 %"], ["Appui à la municipalité contre le projet minier", "Adopté à 87 %"], ["Élection de Francky Roy, Annie Descoteaux et Esso Tcha Damoin", "Élus"]]}, {"d": "2024-11-19", "titre": "Première assemblée prévue (AG Connect)", "etat": "Reportée au 8 janvier 2025", "votes": []}], "budget": {"annuel": 147, "unique": 221, "lignes": [["Activités diverses", 5883.86], ["Entretien parc et sentiers", 2299.5], ["Frais bancaires", 282.7], ["Rencontres des administrateurs", 2299.5], ["Assurance et responsabilité civile", 3028.44], ["Comptabilité et tenue de livres", 4500.0], ["Ressource de soutien aux membres", 6000.0], ["Honoraires professionnels et avocat (recouvrement)", 3000.0], ["Upperbee (1 assemblée en 2026)", 2106.0]]}, "transparence": "Les états financiers, les factures importantes et les soumissions présentées aux assemblées seront publiés ici et dans le dossier des membres, pour que chacun puisse voter en connaissance de cause.", "docs": [{"id": "depart", "titre": "Pour bien commencer", "desc": "Les deux documents à lire en premier, et à remettre à vos locataires pour les règlements du domaine.", "docs": [["Cahier de bienvenue", "bienvenue/cahier-de-bienvenue.pdf", "Présentation de l’Association, contacts et liens utiles", 6810], ["Cahier des membres (règlements)", "bienvenue/cahier-des-membres-2025-05-17.pdf", "Version à jour du 17 mai 2025 · règlements du domaine en pages 6 e par une compagnie", 281], ["Proxy Authorization Form", "formulaires/proxy-en.pdf", "English version", 263], ["Proxy for companies", "formulaires/proxy-companies-en.pdf", "English version", 66], ["Contrat de ramassage des bacs", "formulaires/contrat-ramassage-bacs.pdf", "Service collectif optionnel (chalets construits)", 80]]}, {"id": "archives", "titre": "Archives", "desc": "Versions précédentes, conservées pour référence.", "docs": [["Cahier des membres du 8 janvier 2025", "archives/2025-01-08-cahier-des-membres.pdf", "Remplacé par la version du 17 mai 2025", 129]]}], "transp": {"cats": [{"id": "assurances", "nom": "Assurances", "desc": "Protéger l’Association, ses administrateurs bénévoles et les membres qui utilisent les accès aux lacs, les sentiers et les quais."}, {"id": "assemblees", "nom": "Assemblées et votes", "desc": "Tenir les assemblées en ligne avec vote sécurisé, 1 lot = 1 vote, pour plus de 190 propriétaires."}, {"id": "administration", "nom": "Administration et comptabilité", "desc": "Facturer les cotisations, tenir les livres, produire les états financiers et les déclarations obligatoires."}, {"id": "juridique", "nom": "Services juridiques", "desc": "Conseils et représentation de l’Association lorsque ses droits ou ceux des membres sont en jeu."}, {"id": "lacs", "nom": "Lacs, quais et sentiers", "desc": "Équipements et entretien des accès aux lacs, du parc et des sentiers : ce que les membres utilisent."}, {"id": "communications", "nom": "Vignettes et communications", "desc": "Vignettes d’embarcations (une couleur par lac), pancartes et outils d’information."}, {"id": "benevoles", "court": "Repas et frais payés par des administrateurs", "nom": "Frais des administrateurs", "desc": "Remboursements de dépenses faites par des administrateurs pour l’Association, sur pièces justificatives."}, {"id": "hors", "nom": "Hors Association (pour comprendre vos factures)", "desc": "Services facturés par d’autres entreprises que l’Association. Ils ne passent pas par la caisse de l’Association."}], "f": [{"id": "dpa", "nom": "DPA assurances (Groupe DPA)", "cat": "assurances", "statut": "actif", "court": "Courtier : assurance responsabilité civile, administrateurs et frais juridiques", "liee": "", "role": "Courtier d’assurance de l’Association. Il place et renouvelle chaque année deux polices : la responsabilité civile et administrateurs chez Intact, et les frais juridiques chez ARAG.", "pourquoi": "Sans assurance, une seule réclamation (une chute sur un quai, une blessure dans un sentier, une poursuite contre un administrateur bénévole) pourrait être payée par l’ensemble des membres. L’assurance représente environ 10 % du budget annuel, soit environ 15 $ par lot.", "couts": {"2023": 2281.09, "2024": 2633.97, "2025": 2847.61, "2026": 3083.19}, "contrats": [{"titre": "Responsabilité civile et administrateurs (OBNL)", "type": "police", "assureur": "Intact Compagnie d’assurance", "no": "321-8946", "debut": "2026-10-10", "fin": "2027-10-10", "renouv": "2027-10-10", "total": 2849.12, "resume": "Protège l’Association si un membre, un locataire ou un visiteur se blesse ou subit un dommage lors des activités de l’Association (accès aux 3 lacs, sentiers, chemins et quais d’embarcations non motorisées), et protège les administrateurs bénévoles si on leur reproche une décision prise pour l’Association.", "garanties": [["Responsabilité civile des entreprises – Max", null, null, "titre"], ["Dommages corporels et matériels causés à autrui, par sinistre", 5000000, 1000, "Franchise de 1 000 $ sur les dommages matériels seulement"], ["Montant global produits et après-travaux, par période", 5000000, null, ""], ["Frais médicaux, par personne blessée (sans égard à la faute)", 50000, null, ""], ["Responsabilité locative, par lieu loué ou occupé", 500000, 1000, ""], ["Automobile des non-propriétaires (F.P.Q. no 6)", 5000000, null, "Véhicule non détenu par l’Association, utilisé pour ses activités"], ["Dommages aux véhicules loués (F.A.Q. no 6-94)", 50000, 1000, ""], ["Responsabilité assumée par contrat (F.A.Q. no 6-96)", null, null, "Inclus"], ["Responsabilité affaires (extensions de garantie)", null, 1000, "Selon le formulaire 090.5"], ["Administrateurs et dirigeants d’OBNL (formulaire 350.2)", null, null, "titre"], ["A – Administrateurs non indemnisés par l’Association", 2000000, null, "Par période d’assurance"], ["B – Administrateurs indemnisés par l’Association", 2000000, 1000, ""], ["C – Responsabilité de l’Association elle-même", 2000000, 1000, ""], ["Pratiques d’emploi (acte fautif)", 2000000, 1000, ""], ["Acte fautif d’un fiduciaire", 2000000, 1000, ""], ["Montant global pour les administrateurs, par période", 2000000, null, ""]], "inclusions": ["Blessure d’un membre, d’un invité ou d’un locataire aux accès aux lacs, sur un quai, dans un sentier ou au parc, si l’Association est tenue responsable.", "Dommage à la propriété d’autrui causé par les activités ou les équipements de l’Association (quais, pancartes, supports).", "Frais médicaux d’une personne blessée, jusqu’à 50 000 $, même sans faute prouvée.", "Défense de l’Association en cas de poursuite couverte : les frais de défense s’ajoutent aux montants de garantie.", "Bénévoles qui utilisent leur véhicule pour l’Association : responsabilité au-delà de leur propre assurance auto.", "Administrateurs bénévoles poursuivis pour une décision prise au nom de l’Association (erreur, omission, négligence, manquement à leurs devoirs).", "Extensions des administrateurs : conjoint et succession, anciens administrateurs, frais de gestion de crise, violence en milieu de travail, mandat dans un autre organisme.", "Extensions de la responsabilité affaires : pratiques d’emploi, pollution soudaine découverte dans les 120 heures, frais légaux pour des accusations pénales, préjudice pécuniaire, rappel de produits."], "exclusions": ["Abus de toute nature (avenant d’exclusion mis à jour en 2026).", "Dommage moral, préjudice personnel (diffamation, atteinte à la vie privée) et préjudice imputable à la publicité.", "Données électroniques et cyberrisque : une assurance cyber distincte est offerte par le courtier.", "Pollution graduelle ou découverte après 120 heures; substances perfluoroalkylées (SPFA).", "Champignons et spores, terrorisme, pyrite et pyrrhotite.", "Location de véhicules de longue durée; véhicules appartenant à l’Association (aucun pour l’instant).", "Administrateurs : actes malhonnêtes, frauduleux ou criminels, avantages personnels auxquels ils n’ont pas droit, poursuites de l’Association contre ses propres administrateurs (sauf exceptions), réclamations connues ou en cours avant la police.", "Administrateurs : dommages corporels et matériels (couverts plutôt par la responsabilité civile), santé et sécurité du travail, régimes de retraite, amiante."], "aSavoir": ["La police couvre les activités déclarées. Toute nouvelle activité (location d’embarcations, événement, patinoire, portail à l’entrée) doit être déclarée au courtier avant de commencer.", "Un changement important (nouveaux équipements, nouveaux accès, nouvelles recettes) doit être déclaré au courtier en cours d’année.", "En cas de sinistre grave hors des heures de bureau : Intact, 1 866 464-2424."], "historique": [["2023-2024", 2281.09], ["2024-2025", 2406.44], ["2025-2026", 2620.08], ["2026-2027", 2849.12]]}, {"titre": "Frais juridiques (ARAG Solutions juridiques – Entreprise)", "type": "police", "assureur": "HDI Global Specialty SE, par ARAG", "no": "DAS00033", "debut": "2026-10-13", "fin": "2027-10-13", "renouv": "2027-10-13", "total": 234.07, "resume": "Paie les avocats de l’Association dans certains litiges (contrats, emploi, propriété, fiscalité, défense pénale) et donne accès en tout temps à des conseils juridiques par téléphone.", "garanties": [["Couvertures (plafond par réclamation)", null, null, "titre"], ["Litiges liés à l’emploi", 100000, 2500, "Franchise maximale"], ["Protection supplémentaire des employés", 100000, 2500, ""], ["Défense juridique (pénal, santé-sécurité, vie privée)", 100000, 2500, ""], ["Défense liée à un véhicule (moins de 4 500 kg)", 100000, 2500, ""], ["Litiges contractuels et recouvrement de créances", 100000, 2500, "Montant en litige d’au moins 2 500 $"], ["Permis et licences obligatoires", 100000, 2500, ""], ["Protection des biens et de la propriété", 100000, 2500, ""], ["Dommages corporels", 100000, 2500, ""], ["Protection fiscale (vérifications, appels)", 100000, 2500, ""], ["Plafond global par année", 500000, null, ""], ["Services inclus (sans franchise)", null, null, "titre"], ["Assistance juridique téléphonique", null, null, "Illimitée"], ["Examen de documents juridiques", null, null, "12 par année"], ["Rédaction de lettres simples à caractère juridique", null, null, "12 par année"], ["Bibliothèque de documents juridiques et assistance RH", null, null, "Illimitée"]], "inclusions": ["Conseils d’un avocat par téléphone, sans limite, avant de prendre une décision délicate.", "Révision de contrats et lettres de mise en demeure simples (12 de chaque par année).", "Litige avec un fournisseur ou un entrepreneur (bien ou service), si le montant en jeu est d’au moins 2 500 $.", "Atteinte à la propriété de l’Association, nuisance ou dommages physiques à ses biens (montant minimal de 1 000 $).", "Vérification fiscale de l’Association (TPS, TVQ, impôt) et appel d’une décision fiscale.", "Défense si l’Association fait l’objet d’une enquête ou d’une poursuite pénale."], "exclusions": ["Événements qui ne sont pas liés aux activités déclarées de l’Association.", "Réclamation déclarée plus de 120 jours après l’événement; frais engagés avant l’accord écrit de l’assureur.", "Litige portant sur la légalité d’une décision d’une municipalité ou d’un autre organisme public (sauf défense pénale, contrats, permis et fiscalité).", "Actions collectives et révisions judiciaires.", "Diffamation, malhonnêteté, actes intentionnels, violence; amendes, pénalités et dommages accordés à l’autre partie.", "Litiges en const QR = (() => {
  const VIDES = new Set('le la les un une des de du d l j je tu il elle on nous vous ils elles mon ma mes ton ta tes son sa ses notre nos votre vos leur leurs est sont suis ai as a au aux et ou en dans pour par sur avec sans que qu qui quoi quel quelle quels quelles comment quand est ce cet cette ces pas ne n plus peut peux puis puisje faire fait y se s me m t te moi toi ca cela faut doit dois bonjour allo merci svp sil plait si oui non estce'.split(' '));
  const GROUPES = {
    embarcation: 'kayak kayaks canot canots embarcation embarcations planche paddle pedalo chaloupe bateau bateaux vignette vignettes moteur moteurs',
    lac: 'lac lacs plage baignade baigner quai quais acces heure heures',
    bacs: 'bac bacs poubelle poubelles vidange vidanges recyclage ordure ordures collecte compost deplacement',
    argent: 'cotisation cotisations payer paie paye paiement interac cheque facture frais cout coute couts prix combien montant bienvenue taxes',
    vente: 'vendre vends vend vendu vente acheteur acheter achete notaire nouveau nouvelle proprietaire proprietaires',
    assemblee: 'assemblee assemblees aga vote votes voter procuration procurations upperbee reunion quorum visioconference',
    chemin: 'chemin chemins route routes asphalte rue rues',
    neige: 'neige deneigement deneige deneiger souffleuse',
    pancarte: 'pancarte pancartes affiche affiches enseigne enseignes',
    location: 'location louer loue locataire locataires airbnb touriste tourisme bruit',
    municipal: 'municipal municipale municipalite taxe compte',
    documents: 'proces verbal verbaux pv budget budgets document documents',
    joindre: 'joindre contact contacter courriel telephone urgence ca administrateur administrateurs',
    membre: 'membre membres oblige obligatoire obligation clause adherer',
    numero: 'numero cadastre lot lots terrain terrains chalet chalets maison maisons',
    feu: 'feu feux foyer artifice artifices',
    animal: 'chien chiens chat animal animaux',
  };
  const CLE = {};
  for (const [g, l] of Object.entries(GROUPES)) for (const m of l.split(' ')) (CLE[m] ||= new Set()).add(g);
  const racine = m => m.length > 4 ? m.replace(/(s|x)$/, '') : m;
  const mots = s => norm(s).split(/[^a-z0-9]+/).filter(m => m.length > 1 && !VIDES.has(m));
  const groupes = m => CLE[m] || CLE[racine(m)] || [];
  function jetons(s){ const out = new Set(); for (const m of mots(s)) { out.add(racine(m)); for (const g of groupes(m)) out.add('#' + g); } return out; }
  // Nombre de mots différents de chaque groupe : une fiche centrée sur un sujet en contient plusieurs.
  function densite(s){ const n = {}; for (const m of new Set(norm(s).split(/[^a-z0-9]+/))) for (const g of groupes(m)) n['#' + g] = (n['#' + g] || 0) + 1; return n; }
  let BASE = null;
  function base(){
    if (BASE) return BASE;
    const pa = CONFIG.prochaineAssemblee || {}, h = (pa.heure || '').replace(/^(\d{1,2}):00$/, '$1 h').replace(':', ' h ');
    const asm = ['Quand a lieu la prochaine assemblée?', pa.date
      ? `La prochaine assemblée aura lieu le ${fmtD(pa.date)}${h ? ' à ' + h : ''}, en visioconférence (Upperbee). Absent? Envoyez une procuration au moins 72 heures avant.`
      : 'La date n’est pas encore annoncée. L’avis de convocation arrive par courriel de noreply@upperbee.com, et la date sera aussi indiquée dans ce portail.'];
    const fiche = (q, a, src, titre) => ({q, a, src, jq: jetons(q || ''), ja: jetons((titre ? titre + ' ' : '') + a), n: densite((q || '') + ' ' + a)});
    BASE = [...[asm, ...P.faq].map(([q, a]) => fiche(q, a, 'Questions fréquentes')),
            ...P.reglements.flatMap(r => r.p.map(p => fiche(null, p, 'Règlements — ' + r.t, r.t)))];
    return BASE;
  }
  // Chaque mot de la question devient une « idée » : son groupe (ex. canot → embarcation) ou sa racine.
  function idees(s){
    const vu = new Map();
    for (const m of mots(s)) {
      const g = groupes(m), cles = g.size ? [...g].map(x => '#' + x) : [racine(m)], k = cles.join('|');
      if (!vu.has(k)) vu.set(k, Object.assign(cles, {mots: new Set()}));
      vu.get(k).mots.add(racine(m));
    }
    return [...vu.values()];
  }
  const contient = (set, cles) => cles.some(c => set.has(c));
  function chercher(texte){
    const B = base(), ids = idees(texte), N = B.length;
    // Une idée rare (ex. animaux) compte plus qu'une idée présente partout (ex. lac).
    const poids = ids.map(cles => { const df = B.filter(e => contient(e.ja, cles) || contient(e.jq, cles)).length; return df ? Math.log(1 + N / df) : 0; });
    const total = poids.reduce((a, b) => a + b, 0);
    if (!total) return [];
    const res = B.map(e => {
      let s = 0, c = 0; const cov = new Set();
      ids.forEach((cles, i) => {
        if (!poids[i]) return;
        if (contient(e.jq, cles)) { s += 1.6 * poids[i]; c += poids[i]; }
        else if (contient(e.ja, cles)) { s += poids[i]; c += poids[i]; }
        else return;
        cov.add(i);
        for (const m of cles.mots) if (e.jq.has(m) || e.ja.has(m)) s += 0.5 * poids[i];   // le mot exact est présent
        s += 0.15 * poids[i] * Math.min(5, Math.max(0, ...cles.map(k => e.n[k] || 0)));
      });
      if (!e.q) s *= 0.8;
      return {e, s, couv: c / total, cov};
    }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
    return Object.assign(res, {poids});
  }
  return {chercher, trouver: q => base().find(e => e.q === q)};
})();

function brancherFaq(){

  const puces = l => l.length ? '<div class="puces">' + l.map(q => `<button class="puce" type="button" data-q="${esc(q)}">${esc(q)}</button>`).join('') + '</div>' : '';
  function repondre(texte, direct){
    const moi = bulle(esc(texte), 'moi');
    const ecrire = `<a href="mailto:${CONFIG.courriel}?subject=${encodeURIComponent('Question : ' + texte)}">${CONFIG.courriel}</a>`;
    let res = QR.chercher(texte);
    if (direct) { const e = QR.trouver(direct); if (e) res = [{e, couv: 1}, ...res.filter(x => x.e !== e)]; }
    else { const i = res.slice(0, 5).findIndex(x => x.couv >= 0.5); if (i > 0) res.unshift(...res.splice(i, 1)); }   // préférer une fiche qui couvre vraiment la question
    if (!res.length) bulle(`Aucune réponse trouvée pour cette question. Essayez un autre mot (ex. : cotisation, lac, bacs, vente, assemblée) ou écrivez au CA : ${ecrire}.` + puces(['Comment payer ma cotisation?', 'Qui joindre?']), 'asso');
    else if (res[0].couv < 0.5) {
      const proches = res.filter(x => x.e.q).slice(0, 3).map(x => x.e.q);
      bulle(`Pas de réponse précise à cette question. Le CA peut vous répondre : ${ecrire}.` + (proches.length ? '<span class="src">Sujets proches :</span>' + puces(proches) : ''), 'asso');
    } else {
      const [t, ...autres] = res, voir = autres.filter(x => x.e.q).slice(0, 3).map(x => x.e.q);
      let aussi = null;
      if (!direct && t.cov && res.poids) {
        const manque = res.poids.map((w, i) => i).filter(i => res.poids[i] >= 2 && !t.cov.has(i)).sort((a, b) => res.poids[b] - res.poids[a]);
        if (manque.length) aussi = res.find(x => x !== t && x.cov && x.cov.has(manque[0]) && x.e.a !== t.e.a);

        + ((v2 => v2.length ? '<span class="src">Voir aussi :</span>' + puces(v2) : '')(voir.filter(v => !aussi || v !== aussi.e.q))), 'asso');

    if (!s.rep) return `<div class="bloc"><h2>${esc(s.t)}</h2>${s.f.filter(c => !c.si || c.si(v)).map(c => champHTML(c, c.id, v[c.id])).join('')}${s.note ? `<p class="note">${esc(s.note)}</p>` : ''}</div>`;
    const L = v[s.rep];
    return `<div class="bloc"><h2>${esc(s.t)}</h2>${L.map((it, i) => `<div class="groupe">${L.length > 1 ? `<div class="g-tete"><b>${s.rep === 'embarcations' ? 'Embarcation' : 'Personne'} ${i + 1}</b>${i >= s.min ? `<button type="button" class="lien" data-retire="${s.rep}:${i}">Retirer</button>` : ''}</div>` : ''}${s.f.map(c => champHTML(c, `${s.rep}.${i}.${c.id}`, it[c.id])).join('')}</div>`).join('')}
      ${L.length < s.max && s.ajout ? `<button type="button" class="btn" data-ajout="${s.rep}">+ ${esc(s.ajout)}</button>` : ''}</div>`;
  }).join('');
  $$('canvas[data-sig]').forEach(initSig);
  $$('[data-ajout]').forEach(b => b.onclick = () => { lire(); FV.touche = true; v[b.dataset.ajout].push({}); rendreSections(); });
  $$('[data-retire]').forEach(b => b.onclick = () => { lire(); const [r, i] = b.dataset.retire.split(':'); v[r].splice(Number(i), 1); Object.keys(FV.sig).filter(x => x.startsWith(r + '.')).forEach(x => delete FV.sig[x]); rendreSections(); });
  $$('#sections input[type=radio], #sections input[type=checkbox], #sections select').forEach(e => e.addEventListener('change', () => { lire(); FV.touche = true; rendreSections(); }));
}
function lire(){
  const f = $('#formF'); if (!f) return;
  $$('#sections [name]').forEach(e => {
    if (e.type === 'radio' && !e.checked) return;
    const val = e.type === 'checkbox' ? e.checked : e.value.trim(), p = e.name.split('.');
    if (p.length === 3) { FV.v[p[0]][Number(p[1])][p[2]] = val; } else FV.v[e.name] = val;
  });
}
// ---------- signature
function initSig(cv){
  const nom = cv.dataset.sig, box = cv.parentElement, r = box.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.floor(r.width * dpr); cv.height = Math.floor(150 * dpr); cv.style.height = '150px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1f2a44';
  if (FV.sig[nom]) { const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, r.width, 150); im.src = FV.sig[nom]; box.classList.add('signe'); }
  let dessin = false, traits = 0;
  const pt = e => { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); dessin = true; const [x, y] = pt(e); ctx.beginPath(); ctx.moveTo(x, y); };
  cv.onpointermove = e => { if (!dessin) return; const [x, y] = pt(e); ctx.lineTo(x, y); ctx.stroke(); traits++; };
  cv.onpointerup = cv.onpointercancel = () => { if (!dessin) return; dessin = false; if (traits > 3) { FV.sig[nom] = cv.toDataURL('image/png'); FV.touche = true; box.classList.add('signe'); } };
  box.querySelector('[data-efface]').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); delete FV.sig[nom]; traits = 0; box.classList.remove('signe'); };
}
// ---------- vérification et envoi
function verifier(){
  const F = FORMS[FV.k], v = FV.v, err = [];
  const test = (c, val, nom, lib) => {
    const vide = val === undefined || val === '' || val === false;
    if (c.type === 'signature') { if (c.req && !FV.sig[nom]) err.push(`${lib} : la signature manque`); return; }
    if (c.req && vide) { err.push(`${lib} : à remplir`); return; }
    if (vide) return;
    if (c.type === 'email' && !RX_MAIL.test(val)) err.push(`${lib} : courriel invalide`);
    if (c.type === 'cadastres' && !String(val).split(/[,;]+/).map(x => x.replace(/\D/g, '')).filter(Boolean).every(x => RX_CAD.test(x))) err.push(`${lib} : chaque numéro de cadastre a 7 chiffres`);
    if (c.motif && !c.motif.test(String(val).replace(/\s/g, ''))) err.push(`${lib} : format à vérifier`);
  };
  F.sections.filter(s => !s.si || s.si(v)).forEach(s => {
    if (s.rep) v[s.rep].forEach((it, i) => s.f.forEach(c => test(c, it[c.id], `${s.rep}.${i}.${c.id}`, `${c.l}${v[s.rep].length > 1 ? ' (' + (i + 1) + ')' : ''}`)));
    else s.f.filter(c => !c.si || c.si(v)).forEach(c => test(c, v[c.id], c.id, c.l));
  });
  if (!$('[name=_consent]').checked) err.push('Cochez la case de confirmation');
  return err;
}
function charge(){
  const F = FORMS[FV.k], v = copieP(FV.v);
  const fmtV = (c, val) => c.type === 'case' ? (val ? '☑ Accepté' : '☐ Non coché') : c.type === 'date' ? dateL(val) : c.type === 'time' ? String(val).replace(':', ' h ') : c.type === 'cadastres' ? String(val).split(/[,;]+/).map(x => x.replace(/\D/g, '')).filter(Boolean).map(x => x.replace(/^(\d)(\d{3})(\d{3})$/, '$1 $2 $3')).join(', ') : String(val ?? '');
  const rempli = x => x !== undefined && x !== '' && x !== false;
  const sections = F.sections.filter(s => (!s.si || s.si(v)) && s.rep !== 'signataires' && !(s.f.length === 1 && s.f[0].id === 'ville')).map(s => s.rep
    ? {t: s.t, groupes: v[s.rep].map((it, i) => ({t: (s.rep === 'embarcations' ? 'Embarcation ' : 'Élément ') + (i + 1), lignes: s.f.filter(c => c.type !== 'signature' && rempli(it[c.id])).map(c => [c.l, fmtV(c, it[c.id])])}))}
    : {t: s.t, lignes: s.f.filter(c => (!c.si || c.si(v)) && c.id !== 'ville' && rempli(v[c.id])).map(c => [c.l, fmtV(c, v[c.id])])});
  const champs = sections.flatMap(s => s.lignes || s.groupes.flatMap(g => g.lignes.map(x => [g.t + ' · ' + x[0], x[1]])));
  if (v.lots) v.lots = fmtV({type: 'cadastres'}, v.lots);
  if (v.mLot) v.mLot = fmtV({type: 'cadastres'}, v.mLot);
  const sigs = (v.signataires || []).map((s, i) => ({nom: s.nom, courriel: s.courriel, tel: s.tel || '', titre: s.titre || '', image: FV.sig[`signataires.${i}.sig`] || ''}));
  sigs.forEach(s => champs.push(['Signataire', [s.nom, s.titre, s.courriel, s.tel].filter(Boolean).join(' · ')]));
  return {type: FV.k, code: F.code, titre: F.titre, en: F.en, lots: v.lots || '', sections, champs, texte: F.texte(v), signataires: sigs, signeLe: new Date().toISOString(), ville: v.ville || ''};
}
const copieP = o => JSON.parse(JSON.stringify(o));
function apercu(c){ return `<div class="apercu">${docHtml(c, {logo: $('.barre-h img').src, quand: new Date(c.signeLe).toLocaleString('fr-CA', {dateStyle: 'long', timeStyle: 'short'})})}</div>`; }
function brancherFormulaire(k){
  if (!FORMS[k]) return;
  rendreSections();
  const f = $('#formF');
  if (window.PREREMPLIR) PREREMPLIR.brancher(k);
  f.addEventListener('input', e => { lire(); if (e.target.name !== '_consent') FV.touche = true; });
  $('#imprimer').onclick = () => { lire(); ouvrirApercu(); };
  $('#reinit').onclick = async () => { if (!sale() || await dialogue('Réinitialiser le formulaire?', 'Toutes les informations et les signatures entrées seront effacées.', 'Tout effacer', 'Annuler')) { FV = null; $('#contenu').innerHTML = formulaire(k); brancherFormulaire(k); scrollTo(0, 0); } };
  f.onsubmit = async e => {
    e.preventDefault(); lire();
    const err = verifier(), box = $('#erreurs');
    if (err.length) { box.hidden = false; box.innerHTML = '<b>À corriger :</b><ul>' + err.map(x => `<li>${esc(x)}</li>`).join('') + '</ul>'; box.scrollIntoView({behavior: 'smooth', block: 'center'}); return; }
    box.hidden = true;
    const av = FORMS[k].verif && FORMS[k].verif(FV.v); if (av && !confirmerAvertissement(av)) return;
    if (f.site_web.value) return;   // robot
    const c = charge(), etat = $('#etatEnvoi'), bt = $('#envoyer');
    if (!CONFIG.urlScript) { etat.innerHTML = 'L’envoi en ligne n’est pas encore activé. Ouvrez l’aperçu, choisissez « Enregistrer en PDF », puis envoyez le PDF à <a href="mailto:' + CONFIG.courriel + '">' + CONFIG.courriel + '</a>. <button type="button" class="btn" id="ouvrirAp">Ouvrir l’aperçu</button>'; $('#ouvrirAp').onclick = ouvrirApercu; return; }
    bt.disabled = true; etat.textContent = 'Envoi en cours…';
    try {
      const r = await fetch(CONFIG.urlScript, {method: 'POST', body: new URLSearchParams({action: 'formulaire', donnees: JSON.stringify(c)})});
      const x = await r.json();
      if (!x.ok) throw new Error(x.message || 'refusé');
      FV = null;
      $('#contenu').innerHTML = `<div class="bloc merci"><h1>Merci!</h1><p class="lead">Votre ${esc(c.titre.toLowerCase())} a été envoyée à l’Association (numéro <b>${esc(x.numero)}</b>).</p><p>Une copie signée a été envoyée par courriel à : ${c.signataires.map(s => esc(s.courriel)).join(', ')}. Vérifiez vos courriels indésirables si vous ne la voyez pas d’ici quelques minutes.</p><div class="actions"><a class="btn" href="#formulaires">Autre formulaire</a><a class="btn" href="#accueil">Accueil</a></div></div>`;
      scrollTo(0, 0);
    } catch(e2) { bt.disabled = false; etat.innerHTML = 'Le formulaire n’a pas pu être envoyé (' + esc(e2.message) + '). Réessayez, ou utilisez « Aperçu à imprimer » et envoyez le PDF à ' + CONFIG.courriel + '.'; }
  };
}
function confirmerAvertissement(t){ const z = $('#etatEnvoi'); if (z.dataset.ok === t) return true; z.dataset.ok = t; z.innerHTML = '<b>' + esc(t) + '</b> Cliquez de nouveau sur « Signer et envoyer » pour confirmer.'; return false; }
const sale = () => !!(FV && FV.touche);
function dialogue(titre, texte, oui, non){
  return new Promise(ok => {
    const d = document.createElement('div'); d.className = 'dialogue'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
    d.innerHTML = `<div class="boite-d"><h2>${esc(titre)}</h2><p>${esc(texte)}</p><div class="actions"><button class="btn" data-r="0">${esc(non)}</button><button class="btn plein" data-r="1">${esc(oui)}</button></div></div>`;
    const fin = r => { d.remove(); removeEventListener('keydown', esc_); ok(r); }, esc_ = e => { if (e.key === 'Escape') fin(false); };
    d.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) fin(b.dataset.r === '1'); else if (e.target === d) fin(false); });
    addEventListener('keydown', esc_); document.body.appendChild(d); d.querySelector('[data-r="0"]').focus();
  });
}
async function ouvrirApercu(){
  const c = charge(), err = verifier().filter(x => !/case de confirmation/.test(x));
  const m = document.createElement('div'); m.id = 'apercuModal'; m.className = 'dialogue';
  m.innerHTML = `<div class="boite-ap"><div class="ap-barre"><b>Aperçu</b>${err.length ? `<span class="ap-alerte">Incomplet : ${err.length} élément(s) à corriger</span>` : '<span class="ap-ok">Prêt à imprimer ou à enregistrer en PDF</span>'}<button class="btn plein" id="apImp">Imprimer ou enregistrer en PDF</button><button class="btn" id="apFermer">Fermer</button></div><div class="ap-feuille">${apercu(c)}</div></div>`;
  document.body.appendChild(m); document.body.classList.add('avec-apercu');
  const fermer = () => { m.remove(); document.body.classList.remove('avec-apercu'); };
  $('#apFermer').onclick = fermer; m.addEventListener('click', e => { if (e.target === m) fermer(); });
  $('#apImp').onclick = async () => { await Promise.all([...m.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null)); window.print(); };
}
let HASH = location.hash;
async function surNav(){
  const ancien = HASH, cible = location.hash;
  if (ancien === cible) return;
  if (ancien.startsWith('#formulaire/') && sale()) {
    history.replaceState(null, '', ancien);   // on reste sur le formulaire pendant la question
    const ok = await dialogue('Quitter ce formulaire?', 'Les informations et les signatures entrées seront effacées. Voulez-vous vraiment quitter la page?', 'Quitter et effacer', 'Rester sur le formulaire');
    if (ok) { FV = null; location.hash = cible || '#accueil'; }
    return;
  }
  HASH = cible;
  if (ancien.startsWith('#formulaire/')) FV = null;   // retour en arrière : le formulaire repart à neuf
  const m = $('#apercuModal'); if (m) { m.remove(); document.body.classList.remove('avec-apercu'); }
  page();
}
addEventListener('beforeunload', e => { if (sale()) { e.preventDefault(); e.returnValue = ''; } });
addEventListener('hashchange', surNav); nav(); page();
</script></body></html>
